<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.L.S.I. Assistant</title>
    <style>
        body {
            background-color: #0A0B0E;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #00ffcc; font-size: 24px; }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #333;
        }
        input { width: 100%; box-sizing: border-box; background: #151821; color: white; }
        button { background: #00ffcc; color: black; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>S.L.S.I. Assistant Control Panel</h1>
    <p>Type commands below (e.g., <em>open logiccoil's profile in github in chrome</em>)</p>
    <input type="text" id="commandInput" placeholder="Type a command...">
    <button id="sendBtn">Execute</button>
    <pre id="output" style="background: #111; padding: 10px; margin-top: 15px; border-radius: 5px;"></pre>

    <script src="renderer.js"></script>
</body>
</html>
