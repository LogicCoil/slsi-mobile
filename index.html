<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>S.L.S.I. Mobile</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0A0B0E;
            --surface-color: #12141C;
            --accent-glow: #00F0FF;
            --text-main: #E0E6ED;
            --text-muted: #8A99AD;
            --active-mic: #FF3366;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
        }

        .mobile-header {
            background-color: var(--surface-color);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-glow);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            letter-spacing: 1.5px;
        }

        .voice-status {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* API Key Overlay Modal */
        #apiKeyModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 11, 14, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--surface-color);
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            text-align: center;
        }

        .modal-content h3 {
            color: var(--accent-glow);
            margin-top: 0;
        }

        .modal-content input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 6px;
            padding: 10px;
            color: var(--text-main);
            margin-bottom: 15px;
            font-size: 14px;
            outline: none;
        }

        .modal-content button {
            width: 100%;
            background: var(--accent-glow);
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 15px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background-color: #1A2238;
            align-self: flex-end;
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            background-color: var(--surface-color);
            align-self: flex-start;
            border-left: 3px solid var(--accent-glow);
            border-bottom-left-radius: 2px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.05);
        }

        .input-area {
            background-color: var(--surface-color);
            border-top: 1px solid rgba(0, 240, 255, 0.2);
            padding: 10px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        .icon-btn {
            background-color: var(--bg-color);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--accent-glow);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .icon-btn.active {
            background-color: var(--active-mic);
            color: #fff;
            border-color: var(--active-mic);
            box-shadow: 0 0 12px rgba(255, 51, 102, 0.8);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .send-btn {
            background-color: var(--accent-glow);
            color: #000;
            border: none;
            padding: 0 18px;
            height: 44px;
            font-weight: bold;
            border-radius: 22px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- First Launch API Key Setup Modal -->
    <div id="apiKeyModal" style="display: none;">
        <div class="modal-content">
            <h3>Configure S.L.S.I.</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">Enter your Gemini API key to activate mobile intelligence.</p>
            <input type="password" id="apiKeyInput" placeholder="Paste your API key here...">
            <button onclick="saveApiKey()">Save & Connect</button>
        </div>
    </div>

    <div class="mobile-header">
        <div class="logo">S.L.S.I. MOBILE</div>
        <div class="voice-status" id="voiceStatus">VOICE: OFF</div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message ai">S.L.S.I. Mobile online. Tap the microphone icon to enable Voice-to-Voice mode, or type a message below.</div>
    </div>

    <div class="input-area">
        <button class="icon-btn" id="micBtn" onclick="toggleVoiceMode()">🎤</button>
        <input type="text" id="userInput" placeholder="Ask S.L.S.I...." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()">SEND</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
